<text x="56" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#eef2f6" text-anchor="start">The AI and agent platform map</text>
<text x="56" y="100" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="17" font-weight="400" fill="#9fb2c6" text-anchor="start">One governed gateway in the middle; ways to ask on one side, ways to build and feed agents on the other</text>
