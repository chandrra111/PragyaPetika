<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t-governance d-governance">
<title id="t-governance">The governance stack, layer by layer</title><desc id="d-governance">Six stacked layers from securables up to classification and audit, with a panel showing where policies are enforced.</desc>
<defs><linearGradient id="g-governance" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2138"/><stop offset="1" stop-color="#0a1626"/></linearGradient></defs>
<rect width="1200" height="675" fill="url(#g-governance)"/>
<rect x="0" y="0" width="8" height="675" fill="#e0b559"/>
<text x="56" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#eef2f6" text-anchor="start">The governance stack, layer by layer</text>
<text x="56" y="100" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="17" font-weight="400" fill="#9fb2c6" text-anchor="start">Grants, roles, policies, tags and classification now work as one model — reaching views, AI services and external engines</text>
<rect x="56" y="130" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="130" width="8" height="66" rx="4" fill="#e0b559"/><text x="92" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#e0b559" text-anchor="start">6</text><text x="140" y="158" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">Classification &amp; audit</text><text x="140" y="181" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">Data classification (+50 classes) · query history · system tables · configurable retention</text><rect x="56" y="208" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="208" width="8" height="66" rx="4" fill="#4cc2d6"/><text x="92" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#4cc2d6" text-anchor="start">5</text><text x="140" y="236" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">Attributes &amp; tags</text><text x="140" y="259" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">Governed tags · tag automation · propagation via lineage · identity &amp; context attributes</text><rect x="56" y="286" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="286" width="8" height="66" rx="4" fill="#e0b559"/><text x="92" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#e0b559" text-anchor="start">4</text><text x="140" y="314" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">Policies (ABAC)</text><text x="140" y="337" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">Row filters &amp; column masks · GRANT and DENY · metastore-wide · on views · time travel</text><rect x="56" y="364" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="364" width="8" height="66" rx="4" fill="#4cc2d6"/><text x="92" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#4cc2d6" text-anchor="start">3</text><text x="140" y="392" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">Roles (RBAC)</text><text x="140" y="415" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">Assume a role for a session so only that role’s permissions apply — now GA</text><rect x="56" y="442" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="442" width="8" height="66" rx="4" fill="#e0b559"/><text x="92" y="484" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#e0b559" text-anchor="start">2</text><text x="140" y="470" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">Privileges</text><text x="140" y="493" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">READ METADATA (GA) · INSERT / UPDATE / DELETE least-privilege grants (Beta) · MANAGE</text><rect x="56" y="520" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="520" width="8" height="66" rx="4" fill="#4cc2d6"/><text x="92" y="562" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#4cc2d6" text-anchor="start">1</text><text x="140" y="548" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">Securables</text><text x="140" y="571" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">Catalogs, schemas, tables, views, volumes, models, secrets, MCP services</text><rect x="850" y="130" width="294" height="464" rx="10" fill="#1c3d63" stroke="#2a4a70" stroke-width="1.5"/><text x="872" y="168" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="18" font-weight="700" fill="#e0b559" text-anchor="start">Enforced across</text><circle cx="880" cy="204" r="5" fill="#4cc2d6"/><text x="896" y="210" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="15" font-weight="400" fill="#eef2f6" text-anchor="start">SQL warehouses</text><circle cx="880" cy="248" r="5" fill="#4cc2d6"/><text x="896" y="254" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="15" font-weight="400" fill="#eef2f6" text-anchor="start">Serverless compute</text><circle cx="880" cy="292" r="5" fill="#4cc2d6"/><text x="896" y="298" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="15" font-weight="400" fill="#eef2f6" text-anchor="start">Views and time-travel queries</text><circle cx="880" cy="336" r="5" fill="#4cc2d6"/><text x="896" y="342" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="15" font-weight="400" fill="#eef2f6" text-anchor="start">Models &amp; MCP services</text><circle cx="880" cy="380" r="5" fill="#4cc2d6"/><text x="896" y="386" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="15" font-weight="400" fill="#eef2f6" text-anchor="start">External engines</text><text x="896" y="403" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="15" font-weight="400" fill="#9fb2c6" text-anchor="start">(cross-engine ABAC, GA)</text><text x="872" y="448" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#e0b559" text-anchor="start">Why it matters</text><text x="872" y="478" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Tag once, protect everywhere</text><text x="872" y="506" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Policy follows the data, not the engine</text><text x="872" y="534" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Least privilege becomes practical</text>
