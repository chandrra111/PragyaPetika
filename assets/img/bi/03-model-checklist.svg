<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t-bi-model d-bi-model">
<title id="t-bi-model">A semantic model checklist</title><desc id="d-bi-model">Six stacked layers from model shape up to review and release, with a panel of quick checks.</desc>
<defs><linearGradient id="g-bi-model" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2138"/><stop offset="1" stop-color="#0a1626"/></linearGradient></defs>
<rect width="1200" height="675" fill="url(#g-bi-model)"/>
<rect x="0" y="0" width="8" height="675" fill="#e0b559"/>
<text x="56" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#eef2f6" text-anchor="start">A semantic model checklist</text>
<text x="56" y="100" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="17" font-weight="400" fill="#9fb2c6" text-anchor="start">Six layers to get right — each one makes reports, apps and AI answers more trustworthy</text>
<rect x="56" y="130" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="130" width="8" height="66" rx="4" fill="#e0b559"/><text x="92" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#e0b559" text-anchor="start">6</text><text x="140" y="158" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">Review &amp; release</text><text x="140" y="181" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">Project files in source control · TMDL scripts · deployment checks · descriptions on every measure</text><rect x="56" y="208" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="208" width="8" height="66" rx="4" fill="#4cc2d6"/><text x="92" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#4cc2d6" text-anchor="start">5</text><text x="140" y="236" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">Refresh</text><text x="140" y="259" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">Schema-only or data-only refresh · table-level refresh · gateways with soft delete</text><rect x="56" y="286" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="286" width="8" height="66" rx="4" fill="#e0b559"/><text x="92" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#e0b559" text-anchor="start">4</text><text x="140" y="314" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">Security</text><text x="140" y="337" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">Row- and object-level security · audiences in apps · governed sharing</text><rect x="56" y="364" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="364" width="8" height="66" rx="4" fill="#4cc2d6"/><text x="92" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#4cc2d6" text-anchor="start">3</text><text x="140" y="392" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">DAX reuse</text><text x="140" y="415" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">User-defined functions · visual calculations · measures with clear names and descriptions</text><rect x="56" y="442" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="442" width="8" height="66" rx="4" fill="#e0b559"/><text x="92" y="484" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#e0b559" text-anchor="start">2</text><text x="140" y="470" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">Relationships</text><text x="140" y="493" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">Star schema · one-to-many from dimensions · a single date table · no ambiguous paths</text><rect x="56" y="520" width="760" height="66" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><rect x="56" y="520" width="8" height="66" rx="4" fill="#4cc2d6"/><text x="92" y="562" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#4cc2d6" text-anchor="start">1</text><text x="140" y="548" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start">Model shape</text><text x="140" y="571" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="start">Facts and dimensions · agreed metric definitions · the right storage mode for the job</text><rect x="850" y="130" width="294" height="464" rx="10" fill="#1c3d63" stroke="#2a4a70" stroke-width="1.5"/><text x="872" y="168" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="18" font-weight="700" fill="#e0b559" text-anchor="start">Quick checks</text><text x="892" y="206" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Can a new analyst name the</text><text x="892" y="224" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">grain of each fact table?</text><circle cx="876" cy="201" r="5" fill="#4cc2d6"/><text x="892" y="276" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Does every measure have one</text><text x="892" y="294" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">definition and an owner?</text><circle cx="876" cy="271" r="5" fill="#4cc2d6"/><text x="892" y="346" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Is a change one edit, not</text><text x="892" y="364" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">ten copies?</text><circle cx="876" cy="341" r="5" fill="#4cc2d6"/><text x="892" y="416" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Can you refresh only what</text><text x="892" y="434" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">changed?</text><circle cx="876" cy="411" r="5" fill="#4cc2d6"/><text x="892" y="486" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Is it all in source control?</text><circle cx="876" cy="481" r="5" fill="#4cc2d6"/>
<line x1="56" y1="628" x2="1144" y2="628" stroke="#2a4a70"/>
<text x="56" y="653" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9fb2c6" text-anchor="start">Source: Microsoft Learn, What's new in Power BI and Fabric. Independent summary — not affiliated with or endorsed by Microsoft.</text>
<text x="1144" y="653" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e0b559" text-anchor="end">balachandra-srinevasalu.com</text>
</svg>