<title id="t-bi-ai">From prompt to report: the AI authoring stack</title><desc id="d-bi-ai">Layered diagram: ask, build, semantic model, store, with a reminder to keep humans in the loop.</desc>
<defs><linearGradient id="g-bi-ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2138"/><stop offset="1" stop-color="#0a1626"/></linearGradient></defs>
