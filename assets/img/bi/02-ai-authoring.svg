<text x="56" y="100" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="17" font-weight="400" fill="#9fb2c6" text-anchor="start">Assistants and agents sit on top of one governed semantic model, not beside it</text>
<rect x="56" y="130" width="1088" height="74" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><text x="80" y="160" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="15" font-weight="700" fill="#4cc2d6" text-anchor="start" letter-spacing="1.5">ASK</text><text x="80" y="188" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="17" font-weight="400" fill="#eef2f6" text-anchor="start">Copilot summaries · Explore · answers in Microsoft 365 Copilot Chat · Fabric data agents</text><rect x="56" y="222" width="1088" height="74" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><text x="80" y="252" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="15" font-weight="700" fill="#e0b559" text-anchor="start" letter-spacing="1.5">BUILD</text><text x="80" y="280" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="17" font-weight="400" fill="#eef2f6" text-anchor="start">Copilot in web modeling · agent skills for reports · Desktop Bridge · Fabric Apps</text><rect x="56" y="314" width="1088" height="100" rx="10" fill="#1c3d63" stroke="#e0b559" stroke-width="2"/><text x="600" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#e0b559" text-anchor="middle" letter-spacing="1">SEMANTIC MODEL</text><text x="600" y="378" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2f6" text-anchor="middle">measures · relationships · descriptions · row- and object-level security</text><text x="600" y="400" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb2c6" text-anchor="middle">one governed definition that every surface above reads</text><rect x="56" y="432" width="1088" height="74" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><text x="80" y="462" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="15" font-weight="700" fill="#4cc2d6" text-anchor="start" letter-spacing="1.5">STORE</text><text x="80" y="490" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="17" font-weight="400" fill="#eef2f6" text-anchor="start">OneLake · Direct Lake · mirrored sources · shortcuts with delegated identity</text><rect x="56" y="524" width="1088" height="84" rx="10" fill="#0f2138" stroke="#2a4a70" stroke-width="1.5"/><text x="80" y="548" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="17" font-weight="700" fill="#e0b559" text-anchor="start">Keep humans in the loop</text><circle cx="84" cy="574" r="4" fill="#4cc2d6"/><text x="98" y="579" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#eef2f6" text-anchor="start">Many pieces are still in preview — pilot first</text><circle cx="604" cy="574" r="4" fill="#4cc2d6"/><text x="618" y="579" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#eef2f6" text-anchor="start">Write the contract before the prompt</text><circle cx="84" cy="594" r="4" fill="#4cc2d6"/><text x="98" y="599" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#eef2f6" text-anchor="start">Review generated DAX and visuals</text><circle cx="604" cy="594" r="4" fill="#4cc2d6"/><text x="618" y="599" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#eef2f6" text-anchor="start">Watch prompts and answers for sensitive data</text>
