<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t-bi-flow d-bi-flow">
<title id="t-bi-flow">From request to report: a design flow</title><desc id="d-bi-flow">Five-step flow — question, metric, model, design, review — each with four checks, and a rule of thumb.</desc>
<defs><linearGradient id="g-bi-flow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2138"/><stop offset="1" stop-color="#0a1626"/></linearGradient></defs>
<rect width="1200" height="675" fill="url(#g-bi-flow)"/>
<rect x="0" y="0" width="8" height="675" fill="#e0b559"/>
<text x="56" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#eef2f6" text-anchor="start">From request to report: a design flow</text>
<text x="56" y="100" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="17" font-weight="400" fill="#9fb2c6" text-anchor="start">Five steps that keep dashboards useful and stop them being rebuilt</text>
<path d="M56 134 h184 l22 30 l-22 30 h-184 l22 -30 z" fill="#e0b559"/><text x="155" y="172" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2138" text-anchor="middle">Question</text><rect x="56" y="214" width="206" height="296" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><circle cx="74" cy="239" r="4" fill="#e0b559"/><text x="86" y="244" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Which decision does</text><text x="86" y="263" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">this support?</text><circle cx="74" cy="305" r="4" fill="#e0b559"/><text x="86" y="310" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Who makes it, and how</text><text x="86" y="329" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">often?</text><circle cx="74" cy="371" r="4" fill="#e0b559"/><text x="86" y="376" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">What would they do</text><text x="86" y="395" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">differently?</text><circle cx="74" cy="437" r="4" fill="#e0b559"/><text x="86" y="442" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Is a report even</text><text x="86" y="461" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">needed?</text><path d="M276 134 h184 l22 30 l-22 30 h-184 l22 -30 z" fill="#4cc2d6"/><text x="375" y="172" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2138" text-anchor="middle">Metric</text><rect x="276" y="214" width="206" height="296" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><circle cx="294" cy="239" r="4" fill="#4cc2d6"/><text x="306" y="244" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">One agreed definition</text><text x="306" y="263" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">each</text><circle cx="294" cy="305" r="4" fill="#4cc2d6"/><text x="306" y="310" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">A named owner</text><circle cx="294" cy="371" r="4" fill="#4cc2d6"/><text x="306" y="376" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Targets and thresholds</text><circle cx="294" cy="437" r="4" fill="#4cc2d6"/><text x="306" y="442" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Hidden ambiguity</text><text x="306" y="461" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">audited</text><path d="M496 134 h184 l22 30 l-22 30 h-184 l22 -30 z" fill="#e0b559"/><text x="595" y="172" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2138" text-anchor="middle">Model</text><rect x="496" y="214" width="206" height="296" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><circle cx="514" cy="239" r="4" fill="#e0b559"/><text x="526" y="244" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Facts and dimensions</text><circle cx="514" cy="305" r="4" fill="#e0b559"/><text x="526" y="310" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Reusable measures</text><circle cx="514" cy="371" r="4" fill="#e0b559"/><text x="526" y="376" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Security designed in</text><circle cx="514" cy="437" r="4" fill="#e0b559"/><text x="526" y="442" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Documented in the</text><text x="526" y="461" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">model</text><path d="M716 134 h184 l22 30 l-22 30 h-184 l22 -30 z" fill="#4cc2d6"/><text x="815" y="172" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2138" text-anchor="middle">Design</text><rect x="716" y="214" width="206" height="296" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><circle cx="734" cy="239" r="4" fill="#4cc2d6"/><text x="746" y="244" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Brand theme from one</text><text x="746" y="263" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">file</text><circle cx="734" cy="305" r="4" fill="#4cc2d6"/><text x="746" y="310" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Few visuals, clear</text><text x="746" y="329" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">hierarchy</text><circle cx="734" cy="371" r="4" fill="#4cc2d6"/><text x="746" y="376" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">KPI, trend, then</text><text x="746" y="395" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">detail</text><circle cx="734" cy="437" r="4" fill="#4cc2d6"/><text x="746" y="442" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Accessible colour and</text><text x="746" y="461" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">contrast</text><path d="M936 134 h184 l22 30 l-22 30 h-184 l22 -30 z" fill="#e0b559"/><text x="1035" y="172" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2138" text-anchor="middle">Review</text><rect x="936" y="214" width="206" height="296" rx="10" fill="#16314f" stroke="#2a4a70" stroke-width="1.5"/><circle cx="954" cy="239" r="4" fill="#e0b559"/><text x="966" y="244" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Test on a clean</text><text x="966" y="263" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">machine</text><circle cx="954" cy="305" r="4" fill="#e0b559"/><text x="966" y="310" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Check with the real</text><text x="966" y="329" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">audience</text><circle cx="954" cy="371" r="4" fill="#e0b559"/><text x="966" y="376" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Track how often it</text><text x="966" y="395" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">gets redone</text><circle cx="954" cy="437" r="4" fill="#e0b559"/><text x="966" y="442" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Retire what nobody</text><text x="966" y="461" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">opens</text><rect x="56" y="536" width="1088" height="66" rx="10" fill="#1c3d63" stroke="#2a4a70" stroke-width="1.5"/><text x="78" y="564" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="17" font-weight="700" fill="#e0b559" text-anchor="start">The rule of thumb</text><text x="78" y="586" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#eef2f6" text-anchor="start">Not everything has to be a dashboard. Pick the smallest format that gets the decision made.</text>
<line x1="56" y1="628" x2="1144" y2="628" stroke="#2a4a70"/>
